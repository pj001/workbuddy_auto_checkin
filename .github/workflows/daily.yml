name: Buddy 加油站每日自动化

on:
  schedule:
    # GitHub 的 cron 是尽力而为：高负载时会延迟，甚至静默丢弃整次运行。
    # 因此设三个时段互为备份 —— 只要有一个跑到，当天就完成了。
    # 脚本是幂等的：已签过只会返回「今日已签过」，名额用完不会重派，
    # 所以多触发不会重复领取。
    #
    # 间隔取 6 小时，是因为猫猫旅行时长最长 4 小时（travel/config 的
    # duration_hours_max），这样下一轮运行时它必定已经到家，可以领回礼物。
    # 三个点都落在 :10，避开 GitHub 文档提示的整点高负载期。
    #
    # 注意 cron 按 UTC 计时，下面是 UTC，括号内为北京时间（UTC+8）。
    - cron: "10 0 * * *"    # 00:10 UTC = 08:10 北京（主时段）
    - cron: "10 6 * * *"    # 06:10 UTC = 14:10 北京（备份）
    - cron: "10 12 * * *"   # 12:10 UTC = 20:10 北京（备份）
  workflow_dispatch:
    inputs:
      accounts:
        description: "账号编号，逗号分隔（如 1,2）；留空则按 WB_ACCESS_COUNT 变量"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: wb-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 定位 Python 解释器
        id: py
        # 解释器路径不写死版本号，动态取 runner 上可用的解释器
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "未找到可用的 Python 解释器" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print("使用解释器:", sys.executable, sys.version.split()[0])'
          echo "python_path=$PY" >> "$GITHUB_OUTPUT"

      - name: 执行签到与派猫猫（多账号）
        id: run
        env:
          WB_ENDPOINT: https://copilot.tencent.com
          # 手动 Run workflow 时由 accounts 输入覆盖；
          # 留空时按仓库变量 WB_ACCESS_COUNT 决定跑账号 1..N（默认 1）
          ACCOUNTS: ${{ github.event.inputs.accounts }}
          WB_ACCESS_COUNT: ${{ vars.WB_ACCESS_COUNT }}
          # 兼容误建成 Secret 的情况（建议优先用 Variables）
          WB_ACCESS_COUNT_SECRET: ${{ secrets.WB_ACCESS_COUNT }}
          # 兼容旧变量名
          WB_COUNT: ${{ vars.WB_COUNT }}
          # 账号 1 兼容无后缀 Secret；账号 N 用 WB_ACCESS_TOKEN_N
          T0: ${{ secrets.WB_ACCESS_TOKEN }}
          T1: ${{ secrets.WB_ACCESS_TOKEN_1 }}
          T2: ${{ secrets.WB_ACCESS_TOKEN_2 }}
          T3: ${{ secrets.WB_ACCESS_TOKEN_3 }}
          T4: ${{ secrets.WB_ACCESS_TOKEN_4 }}
          T5: ${{ secrets.WB_ACCESS_TOKEN_5 }}
          T6: ${{ secrets.WB_ACCESS_TOKEN_6 }}
          T7: ${{ secrets.WB_ACCESS_TOKEN_7 }}
          T8: ${{ secrets.WB_ACCESS_TOKEN_8 }}
          T9: ${{ secrets.WB_ACCESS_TOKEN_9 }}
          T10: ${{ secrets.WB_ACCESS_TOKEN_10 }}
        run: |
          # GitHub 默认 bash -e；这里要收集每个账号的退出码再继续，先关掉 -e
          set +e
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          DIR="$RUNNER_TEMP/wb"
          mkdir -p "$DIR"
          : > "$DIR/results.jsonl"
          count=0

          # 账号来源：手动输入优先；留空则按 WB_ACCESS_COUNT 展开 1..N
          if [ -n "${ACCOUNTS:-}" ]; then
            list_src="$ACCOUNTS"
          else
            if [ -n "${WB_ACCESS_COUNT:-}" ]; then
              limit="$WB_ACCESS_COUNT"
              limit_src="Variable WB_ACCESS_COUNT"
            elif [ -n "${WB_ACCESS_COUNT_SECRET:-}" ]; then
              limit="$WB_ACCESS_COUNT_SECRET"
              limit_src="Secret WB_ACCESS_COUNT（建议改建成 Variable）"
            elif [ -n "${WB_COUNT:-}" ]; then
              limit="$WB_COUNT"
              limit_src="Variable WB_COUNT（旧名）"
            else
              limit=1
              limit_src="默认值"
            fi
            echo "账号数量：$limit（来源：$limit_src）"

            case "$limit" in ''|*[!0-9]*) limit=1 ;; esac
            [ "$limit" -ge 1 ] || limit=1
            if [ "$limit" -gt 10 ]; then
              echo "::warning::WB_ACCESS_COUNT=$limit 超过账号位上限 10，只跑 1-10"
              limit=10
            fi
            if [ "$limit" -eq 1 ] && [ -n "${T2:-}" ]; then
              echo "::warning::检测到 WB_ACCESS_TOKEN_2，但当前只跑账号 1。请把 Variables 里的 WB_ACCESS_COUNT 设为 2（或以上）"
            fi
            list_src=$(seq -s, 1 "$limit")
          fi

          # 归一化：逗号分隔、去空白、去重、排序
          list=$(printf '%s' "$list_src" \
            | tr -d ' \t\r' | tr ',' '\n' \
            | grep -E '^[0-9]+$' | sort -n -u | paste -sd, -)
          if [ -z "$list" ]; then
            echo "::error::账号列表无效，请检查 accounts 输入或变量 WB_ACCESS_COUNT"
            exit 1
          fi

          # 一个 job 内串行遍历：没有多余的 checkin job，未配置的账号直接跳过
          for n in $(printf '%s' "$list" | tr ',' ' '); do
            if [ "$n" -lt 1 ] || [ "$n" -gt 10 ]; then
              echo "账号 $n 超出 1-10，跳过（要扩位请改 daily.yml）"
              continue
            fi

            token_var="T$n"
            token="${!token_var:-}"
            if [ "$n" = "1" ] && [ -z "$token" ]; then
              token="${T0:-}"
            fi
            if [ -z "$token" ]; then
              echo "账号 $n 未配置 token，跳过"
              continue
            fi

            count=$((count + 1))
            echo "=== 账号 $n ==="
            # 单账号运行时不带 webhook，避免每个账号各推一张卡；最后统一推送
            WB_ACCESS_TOKEN="$token" FEISHU_WEBHOOK= \
              "$PY" wb_auto.py | tee "$DIR/acc-$n.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              echo "::warning::账号 $n 存在未完成项（exit $code），详见上方日志"
            fi

            if grep -q '^RESULT_JSON ' "$DIR/acc-$n.log"; then
              grep '^RESULT_JSON ' "$DIR/acc-$n.log" | tail -n 1 | sed 's/^RESULT_JSON //' \
                | N="$n" "$PY" -c 'import json, os, sys; d = json.load(sys.stdin); n = os.environ["N"]; d["account"] = "账号" + n; d["account_index"] = int(n); print(json.dumps(d, ensure_ascii=False))' \
                >> "$DIR/results.jsonl"
            else
              echo "::warning::账号 $n 未产出结论文案"
            fi
          done

          if [ "$count" -eq 0 ]; then
            echo "::error::没有任何账号配置了 token，请检查 Secret WB_ACCESS_TOKEN / WB_ACCESS_TOKEN_N"
            exit 1
          fi

      - name: 汇总并推送飞书
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RESULTS_FILE: ${{ runner.temp }}/wb/results.jsonl
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          import wb_auto

          rows = []
          path = os.environ["RESULTS_FILE"]
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  rows = [json.loads(line) for line in f if line.strip()]
          rows.sort(key=lambda r: r.get("account_index", 0))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("### Buddy 加油站每日自动化（多账号）\n\n")
                  if rows:
                      f.write("| 账号 | 签到 | 猫猫旅行 |\n| --- | --- | --- |\n")
                      for r in rows:
                          f.write("| %s | %s | %s |\n" % (
                              r["account"],
                              ("✅ " if r["checkin"]["ok"] else "❌ ") + r["checkin"]["report"],
                              "🐱 " + r["buddy"].get("report", "无结论"),
                          ))
                  else:
                      f.write("- 本轮没有产出任何账号结论，请查看上方日志\n")
                  f.write("\n")

          if not rows:
              print("没有账号产出结果，不推送飞书")
              sys.exit(0)

          checkin_line = "\n".join(
              "%s **%s**：%s" % ("✅" if r["checkin"]["ok"] else "❌",
                                r["account"], r["checkin"]["report"])
              for r in rows
          )
          buddy_line = "\n".join(
              "🐱 **%s**：%s" % (r["account"], r["buddy"].get("report", "无结论"))
              for r in rows
          )
          overall_ok = all(r["checkin"]["ok"] for r in rows)

          webhook = os.environ.get("FEISHU_WEBHOOK")
          push_ok, reason = None, "未配置（缺少 FEISHU_WEBHOOK，本次不推送）"
          if webhook:
              push_ok, reason = wb_auto.push_feishu(
                  webhook,
                  "每日自动化（%d 个账号）" % len(rows),
                  checkin_line,
                  buddy_line,
                  overall_ok,
              )

          push_line = "✅ 已推送飞书" if push_ok else "❌ 推送失败：%s" % reason
          print(push_line)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("- 飞书推送：%s\n" % push_line)
          PYEOF
