name: Buddy 加油站每日自动化

on:
  schedule:
    # GitHub 的 cron 是尽力而为：高负载时会延迟，甚至静默丢弃整次运行。
    # 因此设三个时段互为备份 —— 只要有一个跑到，当天就完成了。
    # 脚本是幂等的：已签过只会返回「今日已签过」，名额用完不会重派，
    # 所以多触发不会重复领取。
    #
    # 间隔取 6 小时，是因为猫猫旅行时长最长 4 小时（travel/config 的
    # duration_hours_max），这样下一轮运行时它必定已经到家，可以领回礼物。
    # 三个点都落在 :10，避开 GitHub 文档提示的整点高负载期。
    #
    # 注意 cron 按 UTC 计时，下面是 UTC，括号内为北京时间（UTC+8）。
    - cron: "10 0 * * *"    # 00:10 UTC = 08:10 北京（主时段）
    - cron: "10 6 * * *"    # 06:10 UTC = 14:10 北京（备份）
    - cron: "10 12 * * *"   # 12:10 UTC = 20:10 北京（备份）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 定位 Python 解释器
        id: py
        # 解释器路径不写死版本号，动态取 runner 上可用的解释器
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "未找到可用的 Python 解释器" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print("使用解释器:", sys.executable, sys.version.split()[0])'
          echo "python_path=$PY" >> "$GITHUB_OUTPUT"

      - name: 执行签到与派猫猫（多账号）
        id: run
        env:
          WB_ENDPOINT: https://copilot.tencent.com
          # 多账号清单：一个 Secret 存多行「显示名=token」，增减账号只改 Secret，
          # 不用动本文件；账号数量跟随清单行数，10 个也只是多循环几次。
          # 未配置时回退到原来的单账号 Secret，老配置无需迁移。
          # token 只在运行时内存中使用，脚本自身会脱敏，不会出现在日志里。
          WB_ACCOUNTS: ${{ secrets.WB_ACCOUNTS }}
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          WB_ACCESS_TOKEN_2: ${{ secrets.WB_ACCESS_TOKEN_2 }}
        run: |
          # GitHub 默认用 bash -e 执行；这里要收集每个账号的退出码再继续，
          # 所以先关掉 -e，失败只记 warning，不中断后面的账号。
          set +e
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          DIR="$RUNNER_TEMP/wb"
          mkdir -p "$DIR"
          : > "$DIR/results.jsonl"
          idx=0
          count=0

          # 优先用 WB_ACCOUNTS；没配则回退到单账号 Secret（兼容老配置）。
          accounts="${WB_ACCOUNTS:-}"
          if [ -n "${accounts//[[:space:]]/}" ]; then
            ACCOUNTS="$accounts"
          else
            ACCOUNTS="账号1=${WB_ACCESS_TOKEN:-}"
            if [ -n "${WB_ACCESS_TOKEN_2:-}" ]; then
              ACCOUNTS="$ACCOUNTS"$'\n'"账号2=${WB_ACCESS_TOKEN_2:-}"
            fi
          fi

          # 账号之间串行执行：日志不交错、请求量小，整体仍在几十秒内跑完。
          # 单个账号失败不影响后面的账号，最后统一汇总并只推一张飞书卡。
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [ -z "$line" ] && continue
            name="${line%%=*}"
            token="${line#*=}"
            # token 本身不含空白；顺手去掉复制粘贴可能带进来的空格/制表符
            token="${token//[[:space:]]/}"
            idx=$((idx + 1))

            if [ -z "$token" ] || [ "$token" = "$line" ]; then
              echo "::warning::账号「$name」未配置 token（格式应为 显示名=token），已跳过"
              continue
            fi

            count=$((count + 1))
            echo "=== 账号「$name」 ==="
            WB_ACCESS_TOKEN="$token" "$PY" wb_auto.py | tee "$DIR/acc$idx.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              echo "::warning::账号「$name」存在未完成项（exit $code），详见上方日志"
            fi

            # 脚本最后一行输出 RESULT_JSON，收集起来供汇总步骤拼卡片
            if grep -q '^RESULT_JSON ' "$DIR/acc$idx.log"; then
              grep '^RESULT_JSON ' "$DIR/acc$idx.log" | tail -n 1 | sed 's/^RESULT_JSON //' \
                | NAME="$name" "$PY" -c 'import json, os, sys; d = json.load(sys.stdin); d["account"] = os.environ["NAME"]; print(json.dumps(d, ensure_ascii=False))' \
                >> "$DIR/results.jsonl"
            else
              echo "::warning::账号「$name」未产出结论文案"
            fi
          done <<< "$ACCOUNTS"

          if [ "$count" -eq 0 ]; then
            echo "::error::没有可用的账号 token，请配置 Secret WB_ACCOUNTS（多行 显示名=token）或 WB_ACCESS_TOKEN"
            exit 1
          fi

      - name: 汇总并推送飞书
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WB_DIR: ${{ runner.temp }}/wb
        run: |
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          # 多账号合并成一张卡：签到、猫猫旅行各按账号分节，避免刷屏。
          # 直接复用 wb_auto.push_feishu，卡片样式与单账号时完全一致。
          "$PY" - <<'PYEOF'
          import json
          import os
          import sys

          import wb_auto

          results_path = os.path.join(os.environ["WB_DIR"], "results.jsonl")
          rows = []
          if os.path.exists(results_path):
              with open(results_path, encoding="utf-8") as f:
                  rows = [json.loads(line) for line in f if line.strip()]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("### Buddy 加油站每日自动化（多账号）\n\n")
                  if rows:
                      f.write("| 账号 | 签到 | 猫猫旅行 |\n| --- | --- | --- |\n")
                      for r in rows:
                          f.write("| %s | %s | %s |\n" % (
                              r["account"],
                              ("✅ " if r["checkin"]["ok"] else "❌ ") + r["checkin"]["report"],
                              "🐱 " + r["buddy"].get("report", "无结论"),
                          ))
                  else:
                      f.write("- 本轮没有产出任何账号结论，请查看上方日志\n")
                  f.write("\n")

          if not rows:
              sys.exit(0)

          checkin_line = "\n".join(
              "%s **%s**：%s" % ("✅" if r["checkin"]["ok"] else "❌",
                                r["account"], r["checkin"]["report"])
              for r in rows
          )
          buddy_line = "\n".join(
              "🐱 **%s**：%s" % (r["account"], r["buddy"].get("report", "无结论"))
              for r in rows
          )
          overall_ok = all(r["checkin"]["ok"] for r in rows)

          webhook = os.environ.get("FEISHU_WEBHOOK")
          push_ok, reason = None, "未配置（缺少 FEISHU_WEBHOOK，本次不推送）"
          if webhook:
              push_ok, reason = wb_auto.push_feishu(
                  webhook,
                  "每日自动化（%d 个账号）" % len(rows),
                  checkin_line,
                  buddy_line,
                  overall_ok,
              )

          push_line = "✅ 已推送飞书" if push_ok else "❌ 推送失败：%s" % reason
          print(push_line)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("- 飞书推送：%s\n" % push_line)
          PYEOF
